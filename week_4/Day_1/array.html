<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const numbers = [10,11,12,15,20];

        numbers.forEach((num) => {
          if (num % 2 === 0) {
            console.log(num);
          }
        });

        const words = ["wow","hey","bye"];

        const hasH = words.some((word) => word.startsWith('h'));
        console.log(hasH);


        const list = words.every((word) => word.startsWith('h'));
        console.log(list);
    </script>
</body>
</html>
