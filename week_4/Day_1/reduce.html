<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let party = [
          {
            desert: 'Chocolate Mousse',
            calories: 30,
          },
          {
            desert: 'Apple Pie',
            calories: 15,
          },
          {
            desert: 'Croissant',
            calories: 50,
          },
          {
            desert: 'Strawberry Icecream',
            calories: 5,
          },
        ];
      
        const totalCalories = party.reduce((acc, val) => {
          if (val.desert !== 'Apple Pie') {
            return acc + val.calories;
          }
          return acc;
        }, 0); 

        console.log(totalCalories); // Output: 85


    </script>
</body>
</html>
