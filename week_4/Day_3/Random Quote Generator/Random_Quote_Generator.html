<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Ultimate Quote Generator</h1>

    <!-- Part 1: Main Quote Display -->
    <button id="generateBtn">Generate Quote</button>
    <section id="quoteSection"><!-- Quotes render here --></section>

    <!-- Part 2: Quote Analysis & Like Buttons -->
    <div class="btn-group">
        <button id="charWithSpaceBtn">Chars (with spaces)</button>
        <button id="charNoSpaceBtn">Chars (no spaces)</button>
        <button id="wordCountBtn">Word Count</button>
        <button id="likeBtn">❤️ Like (<span id="likeCount">0</span>)</button>
    </div>
    <div id="analyticsDisplay" style="font-weight: bold; margin-bottom: 20px; color: #333;"></div>

    <!-- Part 2: Add New Quote Form -->
    <form id="addQuoteForm">
        <h3>Add a New Quote</h3>
        <label for="newQuote">Quote:</label>
        <input type="text" id="newQuote" required>
        <label for="newAuthor">Author:</label>
        <input type="text" id="newAuthor" required>
        <button type="submit">Add Quote</button>
    </form>

    <!-- Part 3: Filter and Navigation Form -->
    <form id="filterForm">
        <h3>Filter by Author</h3>
        <label for="filterAuthor">Author Name:</label>
        <input type="text" id="filterAuthor" required>
        <button type="submit">Filter</button>
    </form>

    <div id="filterNavigation" style="display: none;">
        <div class="btn-group">
            <button id="prevBtn" class="nav-btn">⬅️ Previous</button>
            <button id="nextBtn" class="nav-btn">Next ➡️</button>
            <button id="clearFilterBtn" style="background: #f8d7da;">Clear Filter</button>
        </div>
        <p style="font-size: 0.9rem; color: #666;">Viewing filtered quote <span id="currentIndexDisplay">0</span> of <span id="totalFilteredDisplay">0</span></p>
    </div>

    <script>
        // --- Part 1: Initial Array setup ---
        let quotes = [
            { id: 0, author: "Albert Einstein", quote: "Life is like riding a bicycle. To keep your balance, you must keep moving.", likes: 0 },
            { id: 1, author: "Mark Twain", quote: "The secret of getting ahead is getting started.", likes: 0 },
            { id: 2, author: "Albert Einstein", quote: "Strive not to be a success, but rather to be of value.", likes: 0 },
            { id: 3, author: "Oscar Wilde", quote: "Be yourself; everyone else is already taken.", likes: 0 },
            { id: 4, author: "Steve Jobs", quote: "Your time is limited, so don't waste it living someone else's life.", likes: 0 },
            { id: 5, author: "Walt Disney", quote: "The way to get started is to quit talking and begin doing.", likes: 0 },
            { id: 6, author: "Maya Angelou", quote: "You will face many defeats in life, but never let yourself be defeated.", likes: 0 },
            { id: 7, author: "Nelson Mandela", quote: "The greatest glory in living lies not in never falling, but in rising every time we fall.", likes: 0 },
            { id: 8, author: "Steve Jobs", quote: "The only way to do great work is to love what you do.", likes: 0 },
            { id: 9, author: "Eleanor Roosevelt", quote: "The future belongs to those who believe in the beauty of their dreams.", likes: 0 },
            { id: 10, author: "Oprah Winfrey", quote: "If you look at what you have in life, you'll always have more.", likes: 0 },
            { id: 11, author: "Franklin D. Roosevelt", quote: "The only limit to our realization of tomorrow will be our doubts of today.", likes: 0 },
            { id: 12, author: "Aristotle", quote: "It is during our darkest moments that we must focus to see the light.", likes: 0 },
            { id: 13, author: "Helen Keller", quote: "Many people have the wrong idea of what constitutes true happiness. It is not attained through self-gratification but through fidelity to a worthy purpose.", likes: 0 },
            { id: 14, author: "Jane Goodall", quote: "What you do makes a difference, and you have to decide what kind of difference you want to make.", likes: 0 },
            { id: 15, author: "Mark Twain", quote: "Twenty years from now you will be more disappointed by the things that you didn't do than by the ones you did do.", likes: 0 }
        ];

        let currentQuote = null;
        let lastQuoteId = null;

        // Part 3 Variables
        let filteredQuotes = [];
        let filteredIndex = 0;

        // DOM elements
        const quoteSection = document.getElementById('quoteSection');
        const generateBtn = document.getElementById('generateBtn');
        const analyticsDisplay = document.getElementById('analyticsDisplay');
        const likeCountSpan = document.getElementById('likeCount');

        // --- Part 1: Quote Generator Logic ---
        function displayQuote(quoteObj) {
            currentQuote = quoteObj;
            analyticsDisplay.textContent = ""; // Reset analytics text on change
            likeCountSpan.textContent = quoteObj.likes;

            quoteSection.innerHTML = `
                <div class="quote-text">"${quoteObj.quote}"</div>
                <div class="quote-author">- ${quoteObj.author}</div>
            `;
        }

        function generateRandomQuote() {
            // Hide filter mode if running a random setup
            document.getElementById('filterNavigation').style.display = 'none';

            let availableQuotes = quotes;
            
            // Prevent duplication in a row if there's more than 1 option
            if (quotes.length > 1) {
                availableQuotes = quotes.filter(q => q.id !== lastQuoteId);
            }

            const randomIndex = Math.floor(Math.random() * availableQuotes.length);
            const selectedQuote = availableQuotes[randomIndex];
            
            lastQuoteId = selectedQuote.id;
            displayQuote(selectedQuote);
        }

        generateBtn.addEventListener('click', generateRandomQuote);

        // --- Part 2: Add New Quote ---
        document.getElementById('addQuoteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const quoteText = document.getElementById('newQuote').value.trim();
            const authorText = document.getElementById('newAuthor').value.trim();

            const newQuoteObj = {
                id: quotes.length, // The next sequence index match
                author: authorText,
                quote: quoteText,
                likes: 0
            };

            quotes.push(newQuoteObj);
            this.reset();
            alert("Quote added successfully!");
        });

        // --- Part 2: Analysis Buttons & Likes ---
        document.getElementById('charWithSpaceBtn').addEventListener('click', () => {
            if (!currentQuote) return;
            analyticsDisplay.textContent = `Characters (with spaces): ${currentQuote.quote.length}`;
        });

        document.getElementById('charNoSpaceBtn').addEventListener('click', () => {
            if (!currentQuote) return;
            const lengthNoSpaces = currentQuote.quote.replace(/\s+/g, '').length;
            analyticsDisplay.textContent = `Characters (without spaces): ${lengthNoSpaces}`;
        });

        document.getElementById('wordCountBtn').addEventListener('click', () => {
            if (!currentQuote) return;
            const words = currentQuote.quote.trim().split(/\s+/).filter(w => w.length > 0);
            analyticsDisplay.textContent = `Word count: ${words.length}`;
        });

        document.getElementById('likeBtn').addEventListener('click', () => {
            if (!currentQuote) return;
            currentQuote.likes += 1;
            likeCountSpan.textContent = currentQuote.likes;
        });

        // --- Part 3: Filter & Pagination Logic ---
        document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const searchAuthor = document.getElementById('filterAuthor').value.trim().toLowerCase();

            // Match names ignoring capital letter mismatches
            filteredQuotes = quotes.filter(q => q.author.toLowerCase().includes(searchAuthor));

            if (filteredQuotes.length === 0) {
                alert("No quotes found for this author.");
                document.getElementById('filterNavigation').style.display = 'none';
                return;
            }

            filteredIndex = 0;
            updateFilteredView();
            document.getElementById('filterNavigation').style.display = 'block';
        });

        function updateFilteredView() {
            displayQuote(filteredQuotes[filteredIndex]);
            document.getElementById('currentIndexDisplay').textContent = filteredIndex + 1;
            document.getElementById('totalFilteredDisplay').textContent = filteredQuotes.length;
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (filteredQuotes.length === 0) return;
            // Loop back to start if it hits end bound bounds
            filteredIndex = (filteredIndex + 1) % filteredQuotes.length;
            updateFilteredView();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (filteredQuotes.length === 0) return;
            // Loop back to end if it drops below zero
            filteredIndex = (filteredIndex - 1 + filteredQuotes.length) % filteredQuotes.length;
            updateFilteredView();
        });

        document.getElementById('clearFilterBtn').addEventListener('click', () => {
            document.getElementById('filterForm').reset();
            document.getElementById('filterNavigation').style.display = 'none';
            generateRandomQuote();
        });

        // Initialize display with a default quote on run
        generateRandomQuote();
    </script>
</body>
</html>
