<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GET Form Example</title>
</head>
<body>

    <!-- Setting action="#" submits the form to the same HTML file -->
    <form action="#" method="GET">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="user_name"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="user_message" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Send">
    </form>

</body>
</html>
