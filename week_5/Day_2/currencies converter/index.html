<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- FontAwesome for the loading icon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-box">
        <h1>Currency Converter</h1>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" value="1.00" min="0" step="0.01">
        </div>

        <div class="selection-row">
            <div class="dropdown-group">
                <label for="from-currency">From</label>
                <select id="from-currency" disabled>
                    <option>Loading...</option>
                </select>
            </div>

            <!-- Switch Button -->
            <button id="switch-btn" title="Swap Currencies">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

            <div class="dropdown-group">
                <label for="to-currency">To</label>
                <select id="to-currency" disabled>
                    <option>Loading...</option>
                </select>
            </div>
        </div>

        <button id="convert-btn">Convert</button>

        <div id="result-container">
            <div id="loading" class="hidden">
                <i class="fa-solid fa-spinner fa-spin"></i> Fetching Rates...
            </div>
            <div id="error" class="hidden"></div>
            <div id="output-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
