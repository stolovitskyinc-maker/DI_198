<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIPHY Random Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    form {
      margin-bottom: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #clear-all-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
    }
    #gif-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .gif-card {
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gif-card img {
      max-width: 200px;
      max-height: 200px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .delete-btn {
      background-color: #ffc107;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>GIPHY Random Category Generator</h1>

  <!-- Search Form -->
  <form id="search-form">
    <input type="text" id="search-input" placeholder="Enter category (e.g. sun)" required>
    <button type="submit">Fetch Random GIF</button>
  </form>

  <!-- Clear All Button -->
  <button id="clear-all-btn">DELETE ALL GIFs</button>

  <!-- Container where GIFs append -->
  <div id="gif-container"></div>

  <script src="script.js"></script>
</body>
</html>
