<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Quote, For Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="mark" aria-hidden="true">&#8220;</div>
  <div class="card">
    <p class="eyebrow">A quote, for now</p>
    <p class="quote-text" id="quoteText"></p>
    <div class="byline">
      <p class="author" id="quoteAuthor"></p>
    </div>
    <div class="footer-row">
      <button class="next" id="nextBtn" type="button">
        Next quote
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h16M14 6l6 6-6 6"/>
        </svg>
      </button>
      <p class="count" id="quoteCount"></p>
    </div>
  </div>
</div>

<script src="QuotesDatabase.js"></script>
<script src="script.js"></script>
</body>
</html>
