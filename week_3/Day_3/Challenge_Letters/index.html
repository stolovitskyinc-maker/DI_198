<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge: Letters Only</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f6fa;
            color: #2f3542;
        }
        .input-box {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 2px solid #ced6e0;
            border-radius: 4px;
            outline: none;
        }
        .input-box:focus {
            border-color: #1e90ff;
        }
    </style>
</head>
<body>

    <h2>Daily Challenge: Letters Only</h2>
    <p>Try typing numbers or special characters below; they will automatically be stripped away.</p>
    
    <!-- Text input field restricted to alphabetical characters -->
    <input type="text" id="lettersInput" class="input-box" placeholder="Type letters here...">

    <script src="script.js"></script>
</body>
</html>
