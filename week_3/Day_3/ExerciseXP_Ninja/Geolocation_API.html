<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Geolocation Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f6fa;
            color: #2f3542;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #2f3542;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #747d8c;
        }
        #output {
            margin-top: 20px;
            font-size: 18px;
            font-family: monospace;
            line-height: 1.6;
        }
        .error { color: #ff4757; }
    </style>
</head>
<body>

    <h2>HTML5 Geolocation Tracker</h2>
    <p>Click the button below to retrieve your live coordinate values.</p>
    
    <!-- Trigger Button Layout -->
    <button id="geoBtn">Get My Coordinates</button>

    <!-- Location Output Area Wrapper Workspace -->
    <div id="output"></div>

    <script src="script1.js"></script>
</body>
</html>
