<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validation Challenge</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; width: 300px; }
        input[type="text"], input[type="email"] { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 15px; cursor: pointer; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Email Validation</h2>

    <form id="emailForm">
        <label for="emailInput">Enter your email:</label>
        <input type="email" id="emailInput" required>
        <button type="submit">Submit Form</button>
    </form>

    <div id="resultMessage"></div>

    <script src="script.js"></script>
</body>
</html>
