<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Music</title>
</head>
<body>
    <select id="genres">
        <option value="rock">Rock</option>
        <option value="blues" selected>Blues</option>
    </select>
    
    <script>
        /*
        Instructions:
        1. Display the value of the selected option.
        2. Add an additional option: <option value="classic">Classic</option>
        3. The newly added option should be selected by default.
        */

        // Target the select element dropdown node
        let selectElement = document.getElementById("genres");

        // 1. Display the value of the currently selected option (Logs "blues")
        console.log(`Currently Selected Value: ${selectElement.value}`);


        // 2. Create the brand new option element
        let newOption = document.createElement("option");
        newOption.value = "classic";
        newOption.textContent = "Classic";

        // 3. Make the newly added option selected by default
        newOption.selected = true;

        // Append the newly configured option node directly into the select dropdown wrapper
        selectElement.appendChild(newOption);


        // Verification: Log the updated selection choice value (Logs "classic")
        console.log(`New Default Value: ${selectElement.value}`);

    </script>
</body>
</html>
