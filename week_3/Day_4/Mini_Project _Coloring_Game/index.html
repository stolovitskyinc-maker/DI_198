<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloring Squares Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App Container Layout -->
    <div class="game-container">
        
        <!-- Left Side Panel: Options and Palette -->
        <div class="sidebar">
            <h2>Coloring Squares</h2>
            <p>Pick a color, then click and drag across the canvas grid to draw!</p>
            
            <div id="palette-grid" class="palette-container"></div>
            
            <button id="clear-btn">Clear Canvas</button>
        </div>

        <!-- Right Side Panel: Main Canvas Work Grid -->
        <div id="canvas-grid" class="canvas-container"></div>

    </div>

    <!-- Script File Hook -->
    <script src="script.js"></script>
</body>
</html>
