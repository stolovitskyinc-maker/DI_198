<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Drum Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container Layout holding the interface grid buttons -->
    <div class="keys-container">
        <div class="key" data-key="a"><kbd>A</kbd><span class="sound">Boom</span></div>
        <div class="key" data-key="s"><kbd>S</kbd><span class="sound">Clap</span></div>
        <div class="key" data-key="d"><kbd>D</kbd><span class="sound">HiHat</span></div>
        <div class="key" data-key="f"><kbd>F</kbd><span class="sound">Kick</span></div>
        <div class="key" data-key="g"><kbd>G</kbd><span class="sound">OpenHat</span></div>
        <div class="key" data-key="h"><kbd>H</kbd><span class="sound">Ride</span></div>
        <div class="key" data-key="j"><kbd>J</kbd><span class="sound">Snare</span></div>
        <div class="key" data-key="k"><kbd>K</kbd><span class="sound">Tink</span></div>
        <div class="key" data-key="l"><kbd>L</kbd><span class="sound">Tom</span></div>
    </div>

    <!-- Audio Element Sample Mapping Hooks (Streaming via public assets CDN) -->
    <audio data-key="a" src="boom.wav"></audio>
    <audio data-key="s" src="clap.wav"></audio>
    <audio data-key="d" src="hihat.wav"></audio>
    <audio data-key="f" src="kick.wav"></audio>
    <audio data-key="g" src="openhat.wav"></audio>
    <audio data-key="h" src="ride.wav"></audio>
    <audio data-key="j" src="snare.wav"></audio>
    <audio data-key="k" src="tink.wav"></audio>
    <audio data-key="l" src="tom.wav"></audio>

    <script src="script.js"></script>
</body>
</html>
