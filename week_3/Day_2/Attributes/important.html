<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="elem" value="Write your name">

    <script>
      let newInput= document.getElementById("elem")
      console.log(elem.type); // "text"
      console.log(elem.id); // "elem"
      console.log(elem.value); // "Write your name"

      newInput.className = "myClass"; // adds a class to the element
      console.log(newInput.className); // "myClass"
    </script>
</body>
</html>
